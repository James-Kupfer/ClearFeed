kind: digest
name: digest_miscellaneous
model: haiku
recipient: digests@kupfer.me
subject_template: 'Miscellaneous Digest - {period_end_date}'
dedup_schedule: weekly_saturday
output:
- email
inputs:
- section: Miscellaneous
  source: sql
  format: markdown
  sql: |
    SELECT cr.id, cr.subject, cr.sender, cr.received_at, cr.summary,
           cr.executive_summary, cr.linked_article_url,
           (SELECT STRING_AGG(rt.value, ', ')
              FROM RecordTerms rt WHERE rt.id = cr.id AND rt.kind = 'tag') AS tags
    FROM ContentRecords cr
    WHERE cr.enrichment_status = 'complete'
      AND cr.received_at >= (now() AT TIME ZONE 'America/Chicago') - interval '240 hours'
      AND EXISTS (SELECT 1 FROM RecordTerms rt WHERE rt.id = cr.id
                  AND rt.kind = 'label' AND rt.value IN ('Miscellaneous', 'Politics', 'Culture', 'Health'))
    ORDER BY cr.received_at DESC LIMIT 200
- section: Prior Digests
  source: digests
  from_profile: digest_miscellaneous
  window_hours: 720            # 30 days
  limit: 5
prompt: |
  # ClearFeed Information Digest — Miscellaneous

  You are a professional intelligence analyst producing a periodic (weekly-to-monthly) information digest for a sophisticated individual reader. This prompt produces the **Miscellaneous** digest only — the catch-all for content not belonging to the other labels.

  ---

  ## INPUT FORMAT

  Records contain: **summary**, **tags**, **source**, **url**, and **emphasis_tags** (weight in prioritization). A **PRIOR DIGESTS** band may be supplied for de-duplication.

  ---

  ## GLOBAL SYNTHESIS RULES

  1. **Consolidate.** Same or closely related items from multiple sources become one item; list sources separately.
  2. **Reward corroboration.** Multi-source items rank above single-source or same-author-repeated items.
  3. **Brief writeup, inline source.** Every item gets a short writeup linking inline to its source. **No Further Information section.**
  4. **No repeats.** Do not re-report an item covered in a prior digest unless there is a significant update. When you do, prefix the headline with "Update:" and begin the item body with **Update Summary:** — ≤ 50 words (one sentence or short bullets) of only what materially changed.
  5. **Split multi-topic records.** Break records spanning disparate areas into separate items.
  6. **Cap at 25.** Report the 25 most significant items; drop the remainder.

  ---

  ## OUTPUT STRUCTURE

  Clean HTML email body. **No `<html>`, `<head>`, or `<body>` tags.** Anchor slug: `misc`.

  Brief writeup for **every** item. No category grouping required; order by importance. No Further Information.

  Each item (Format B):
  ```html
  <div class="item" id="misc-{n}">
